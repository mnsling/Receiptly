name: delivery_receipt_tracker
description: A simple supplier receipt and price tracking app powered by Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  supabase_flutter: ^2.18.3
  intl: ^0.20.3
  image_cropper: ^13.0.0
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true